<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PsVita Homebrews – New Releases</title>
<style>
:root {
    --bg: #0f1117;
    --card: #1a1d27;
    --border: #2a2e3b;
    --text: #e6e9f0;
    --muted: #9aa3b5;
    --accent: #7c5cff;
    --github: #2f81f7;
    --gitlab: #fc6d26;
    --pre: #f0b429;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    padding: 24px 16px 60px;
}
.container { max-width: 920px; margin: 0 auto; }
header {
    margin-bottom: 32px;
    text-align: center;
}
header h1 {
    font-size: 1.8rem;
    font-weight: 700;
    letter-spacing: -0.02em;
}
header p {
    color: var(--muted);
    margin-top: 6px;
    font-size: 0.95rem;
}
.stats {
    display: flex;
    gap: 16px;
    justify-content: center;
    margin: 20px 0 28px;
    flex-wrap: wrap;
}
.stat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 0.9rem;
}
.stat strong { color: var(--accent); }

.card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 22px;
    margin-bottom: 18px;
    transition: border-color 0.2s;
}
.card:hover { border-color: #3d4455; }
.card.github { border-left: 4px solid var(--github); }
.card.gitlab { border-left: 4px solid var(--gitlab); }

.card-header { margin-bottom: 12px; }
.title-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
}
.card h2 {
    font-size: 1.25rem;
    font-weight: 600;
}
.card h2 a {
    color: var(--text);
    text-decoration: none;
}
.card h2 a:hover { color: var(--accent); }

.badge {
    font-size: 0.7rem;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 999px;
    text-transform: uppercase;
}
.badge.pre {
    background: rgba(240, 180, 41, 0.15);
    color: var(--pre);
}

.meta {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 14px;
    margin-top: 8px;
    font-size: 0.82rem;
    color: var(--muted);
}
.meta .repo { font-family: ui-monospace, monospace; }
.meta .platform {
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
}
.card.github .platform { color: var(--github); }
.card.gitlab .platform { color: var(--gitlab); }
.meta .tag {
    background: #252836;
    padding: 2px 8px;
    border-radius: 6px;
    font-family: ui-monospace, monospace;
    color: #c5cae0;
}

.body {
    font-size: 0.92rem;
    color: #c8cdd9;
    margin: 12px 0 16px;
    max-height: 180px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
}
.body::-webkit-scrollbar { width: 6px; }
.body::-webkit-scrollbar-thumb { background: #3a3f50; border-radius: 3px; }

.assets {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}
.btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #252836;
    color: #e0e4f0;
    text-decoration: none;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 500;
    border: 1px solid #343a4d;
    transition: background 0.15s, border-color 0.15s;
}
.btn:hover {
    background: #2f3548;
    border-color: var(--accent);
    color: #fff;
}
.btn .size {
    font-size: 0.75rem;
    color: var(--muted);
    margin-left: 4px;
}
.no-assets {
    color: var(--muted);
    font-size: 0.85rem;
    font-style: italic;
}
.empty {
    text-align: center;
    color: var(--muted);
    padding: 40px 0;
}
footer {
    text-align: center;
    margin-top: 40px;
    color: var(--muted);
    font-size: 0.8rem;
}
</style>
</head>
<body>
<div class="container">
    <header>
        <h1>PsVita Homebrews – New Releases</h1>
        <p>Monitor de releases de homebrew (GitHub + GitLab)</p>
        <div class="stats">
            <div class="stat">Total en historial: <strong>0</strong></div>
            <div class="stat">Última actualización: <strong>--</strong></div>
        </div>
    </header>

    <main>
        <p class="empty">Aún no hay releases registrados. Agrega repos en repos.txt y ejecuta el workflow.</p>
    </main>

    <footer>
        Generado automáticamente · PsVita-Homebrews-New-Releases
    </footer>
</div>
</body>
</html>
