name: Temporary audit public Game Data sheet
on:
  push:
    branches: [feature/expand-game-data-coverage]
    paths:
      - ".github/workflows/audit_public_sheet.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Audit public sheet coverage (no download URLs published)
        run: |
          python - <<'PY'
          import csv,io,requests,re,collections
          from urllib.parse import urlparse
          from community_port_sheet import SHEET_CSV_URL, parse_sheet_csv, normalize, urls, repo_identity
          data=requests.get(SHEET_CSV_URL,timeout=30).text
          rows=list(csv.reader(io.StringIO(data)))
          print("CSV rows:",len(rows),"columns:",len(rows[0]) if rows else 0)
          print("HEADERS:",repr(rows[0]))
          h=[normalize(x) for x in rows[0]]
          name=next((i for i,s in enumerate(h) if "game name" in s),1)
          download=next((i for i,s in enumerate(h) if "download link" in s),2)
          project=next((i for i,s in enumerate(h) if "github developer" in s or "developer page" in s),3)
          samples=[]
          statuses=collections.Counter()
          for index,row in enumerate(rows[1:],2):
            def cell(i):return row[i] if i<len(row) else ""
            ds=cell(download).strip()
            pro=cell(project).strip()
            dsurl=urls(ds)
            proids=[repo_identity(u) for u in urls(pro)]
            statuses[("download_url" if dsurl else "download_label" if ds else "blank_download","project_repo" if any(proids) else "no_project_repo")]+=1
            if index%15==0 and len(samples)<25:
              samples.append({"row":index,"name":cell(name)[:70],"download_display":ds[:70] if not dsurl else "<URL>", "dls":len(dsurl),"repos":str([x for x in proids if x])[:110]})
          print("CLASSIFICATIONS:",dict(statuses))
          print("SAMPLES:",samples)
          print("PARSER ACCEPTS:",len(parse_sheet_csv(data)))
          from collections import Counter
          import discover_game_data as gd
          from catalog_schema_v2_compat import to_v1
          url=gd.CATALOG_URL
          canon=to_v1(requests.get(url,timeout=45).json())
          apps=gd.missing_ports(canon)
          known={}
          for a in apps:
            for p,n in a["repositories"]:
              known.setdefault((p,n.lower()),[]).append(a)
          counts=Counter()
          examples=[]
          hosts=Counter()
          for index,row in enumerate(rows[1:],2):
            if len(row)<=max(name,download,project):continue
            a_name=row[name].strip()
            links=urls(row[download])
            if not links:continue
            proids=set(filter(None,(repo_identity(u) for u in urls(row[project]))))
            if not proids:continue
            counts["has_url_and_repo"]+=1
            poss={a["id"]:a for p in proids for a in known.get(p,[])}
            if not poss:
              counts["repo_not_in_missing_catalog"]+=1
              if len(examples)<14:examples.append(("repo_not_found",index,a_name,repr(sorted(proids))[:70]))
              continue
            counts["repo_matches"]+=1
            if len(poss)>1:
              counts["ambiguous_repository"]+=1
              if len(examples)<25:examples.append(("ambig",index,a_name,repr([a["name"] for a in poss.values()])[:110]))
              continue
            found=next(iter(poss.values()))
            an=normalize(found["name"]);rn=normalize(a_name)
            ta={z for z in an.split() if len(z)>3 and z not in {"vita","port"}}
            tr={z for z in rn.split() if len(z)>3 and z not in {"vita","port"}}
            if an!=rn and not ta.intersection(tr):
              counts["same_repo_name_mismatch"]+=1
              if len(examples)<28:examples.append(("name_diff",index,a_name,found["name"]))
              continue
            counts["can_map"]+=1
            hosts[urlparse(links[0]).hostname]+=1
          print("CATALOG COUNT",len(apps))
          print("EXTRA COVERAGE:",dict(counts))
          print("HOSTS MATCHED:",dict(hosts.most_common(12)))
          print("UNMATCHED SAMPLES:",examples)
          PY
