name: Discover missing PS Vita Game Data

on:
  schedule:
    # Offset from the existing release monitor at minute 17.
    - cron: "47 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "discover_game_data.py"
      - "community_port_sheet.py"
      - "external_game_data.py"
      - "game_data_dashboard.py"
      - "tests/test_external_game_data.py"
      - "enrich_dashboard.py"
      - ".github/workflows/discover_game_data.yml"

permissions:
  contents: write
  pages: write
  id-token: write

# Avoid concurrent pushes/deployments from both three-hour monitors.
concurrency:
  group: psvita-release-tracker-v2
  cancel-in-progress: false
  queue: max

jobs:
  discover-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Search public official project sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: python discover_game_data.py

      - name: Rebuild existing dashboard with both tabs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python enrich_dashboard.py

      - name: Commit generated discovery report and dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --staged --quiet; then
            echo "No generated changes"
          else
            git commit -m "chore: refresh game data discovery [skip ci]"
            git push
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy-pages:
    needs: discover-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
