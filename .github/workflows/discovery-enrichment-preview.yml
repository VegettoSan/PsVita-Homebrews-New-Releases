name: Discovery enrichment pilot (read only)
on:
  pull_request:
    branches: [main]
    paths:
      - discovery_enrichment.py
      - preview_discovery_enrichment.py
      - tests/test_discovery_enrichment.py
      - .github/workflows/discovery-enrichment-preview.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        offset: [0, 5, 10]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Existing discovery regressions
        run: python -m unittest discover -s tests -p test_discover_homebrew.py -v
      - name: New enrichment regressions
        run: python -m unittest discover -s tests -p test_discovery_enrichment.py -v
      - name: Read-only sample of existing discoveries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCOVERY_REQUEST_BUDGET: "180"
          DISCOVERY_TIME_BUDGET: "420"
        run: python preview_discovery_enrichment.py --limit 5 --offset ${{ matrix.offset }} --max-files 18 --output enrichment-report-${{ matrix.offset }}.json
      - name: Save pilot report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enrichment-preview-${{ matrix.offset }}
          path: enrichment-report-${{ matrix.offset }}.json
          if-no-files-found: ignore
