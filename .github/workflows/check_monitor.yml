name: Verify release monitor changes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dashboard dependencies
        run: python -m pip install -r requirements.txt
      - name: Python syntax
        run: python -m py_compile monitor.py folder_release_sources.py enrich_dashboard.py catalog_schema_v2_compat.py preservation_status.py discover_game_data.py community_port_sheet.py external_game_data.py game_data_dashboard.py
      - name: Verify Archive.org version labels
        run: python -m unittest discover -s tests -p test_preservation_status.py -v
      - name: Verify combined dashboard status filters
        run: python -m unittest discover -s tests -p test_dashboard_filters.py -v
      - name: Verify folder VPK detection (offline)
        run: python -m unittest discover -s tests -p test_folder_release_sources.py -v
      - name: Verify prerelease snapshots and semantic version ordering
        run: python -m unittest discover -s tests -p test_prerelease_updates.py -v
      - name: Verify GitLab VPK release links and manual-review status
        run: python -m unittest discover -s tests -p test_gitlab_vpk.py -v
      - name: Verify Game Data discovery and dashboard tab
        run: python -m unittest discover -s tests -p test_game_data_discovery.py -v
      - name: Verify additional public Game Data catalog ingestion
        run: python -m unittest discover -s tests -p test_external_game_data.py -v
      - name: Check workflow, snapshot and dispatch contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          monitor = Path("monitor.py").read_text()
          workflow = Path(".github/workflows/monitor.yml").read_text()
          assert "data/upstream_latest.json" in monitor
          assert '"schema_version": 1' in monitor
          assert "psvitaalive_catalog_published" in workflow
          assert "release_monitor_synced" in workflow
          assert "PSVITAALIVE_CATALOG_URL" in workflow
          print("Release monitor integration contracts OK")
          PY
