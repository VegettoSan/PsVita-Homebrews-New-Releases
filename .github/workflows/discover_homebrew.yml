name: Discover New PS Vita Homebrew

on:
  schedule:
    # Separate from release monitor (:17) and Game Data (:47).
    - cron: "13 1-23/3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "discover_homebrew.py"
      - "homebrew_discovery_dashboard.py"
      - "tests/test_discover_homebrew.py"
      - ".github/workflows/discover_homebrew.yml"

permissions:
  contents: write
  pages: write
  id-token: write

# Share deployment/commit lock; discovery itself never runs the release monitor.
concurrency:
  group: psvita-release-tracker-v2
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --ff-only origin main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Unit tests (offline)
        run: python -m unittest discover -s tests -p 'test_discover_homebrew.py' -v

      - name: Discover next bounded batch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          DISCOVERY_PROFILE_LIMIT: "3"
          DISCOVERY_REPO_LIMIT: "150"
          DISCOVERY_REQUEST_BUDGET: "520"
          DISCOVERY_TIME_BUDGET: "720"
        run: python -u discover_homebrew.py

      - name: Render discoveries
        run: python -u homebrew_discovery_dashboard.py

      - name: Rebuild existing dashboard navigation without scanning releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -u enrich_dashboard.py

      - name: Commit generated discovery data and pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discovery/ docs/
          if git diff --cached --quiet; then
            echo "No new discovery data"
            exit 0
          fi
          git commit -m "chore(discovery): checkpoint incremental search [skip ci]"
          # enrich_dashboard.py may refresh unrelated tracked release data; never publish it.
          # Clear only unstaged tracked changes after committing the selected discovery paths.
          git restore --worktree -- .
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Concurrent changes conflict; no overwrite."
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Discovery checkpoint published"
              exit 0
            fi
            sleep "$((attempt * 2))"
          done
          echo "::error::Failed to publish checkpoint"
          exit 1

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: docs

  deploy-pages:
    needs: discover
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
