name: Catalog V2 reader compatibility

on:
  push:
    branches:
      - feature/catalog-schema-v2
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile modules
        run: python -m compileall -q monitor.py enrich_dashboard.py catalog_schema_v2_compat.py
      - name: Compare V1 and V2 repository discovery
        run: |
          python -m pip install requests mistune bleach
          python - <<'PY'
          from catalog_schema_v2_compat import to_v1
          from monitor import discover_repositories
          url = 'https://github.com/example/vita-homebrew'
          v1 = [{'id': 'test', 'title_id': 'TEST00001', 'name': 'Test Homebrew',
                 'links': [{'type': 'Repository', 'name': 'Code', 'url': url}]}]
          v2 = [{'id': 'test', 'tid': 'TEST00001', 'n': 'Test Homebrew',
                 'l': [{'t': 'Repository', 'n': 'Code', 'u': url}]}]
          assert to_v1(v2) == v1
          assert discover_repositories(to_v1(v2)) == discover_repositories(v1)
          print('Monitor V1/V2 repository discovery matches.')
          PY
